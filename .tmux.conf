# Use 24 bit colors if they are available
set-option -sa terminal-overrides ",xterm*:Tc"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Fix broken C-l keybind
bind l send-keys 'C-l'

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g status-position top

# Keep the current path on window splits
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# keybind to reload config
unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n M-Left  swap-window -t -1 \; select-window -t -1
bind -n M-Right swap-window -t +1 \; select-window -t +1

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

set -g @plugin 'tmux-plugins/tmux-yank'
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# set -g @plugin 'jarvick257/pywal-tmux' # TODO: Configure

set -g @plugin 'dracula/tmux'
# Recolor Dracula's palette to match the rest of the desktop theme:
# warm/neutral tones on dark grey, no green. dark_purple is what Dracula
# uses to highlight the *active* window, so it must contrast against gray
# (the inactive-window color) or the current tab is indistinguishable.
set -g @dracula-colors "
white='#dddddd'
gray='#3a3a3a'
dark_gray='#2a2a2a'
light_purple='#e0b880'
dark_purple='#c9a876'
cyan='#dddddd'
green='#e8ddc7'
orange='#c9a876'
red='#ff5555'
pink='#e0b880'
yellow='#f1fa8c'
"
set -g @dracula-plugins "ssh-session git"
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg true
set -g @dracula-left-icon-padding 0
set -g @dracula-show-left-icon "session"
set -g @dracula-show-flags false
set -g @dracula-show-empty-plugins false
set -g @dracula-border-contrast true
set -g @dracula-git-colors "dark_purple white"
set -g @dracula-ssh-session-colors "light_purple dark_gray"
set -g @dracula-show-left-sep " "
set -g @dracula-show-right-sep " "

# This needs to be the last line
run '~/.tmux/plugins/tpm/tpm'

# Hardcoded overrides for the session-badge / window-list boundary, placed
# after tpm/dracula load so nothing generated at plugin-load time can win
# over these. No separator glyphs at all — just flat color blocks, so there
# is no glyph edge for the font rasterizer to antialias.
set -g status-left "#[bg=#e8ddc7,fg=#2a2a2a] #S #[bg=default,fg=#e8ddc7] "
set -g window-status-current-format "#[bg=#c9a876,fg=#dddddd] #I #W #[bg=default,fg=#c9a876] "
set -g window-status-format "#[bg=default,fg=#dddddd] #I #W "
