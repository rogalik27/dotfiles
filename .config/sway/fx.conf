# SwayFX-only visual effects. Only included by the SwayFX session (see
# config-swayfx) — never by the plain "sway" session, since vanilla sway
# doesn't understand these directives and would log config errors on them.

blur enable
blur_xray enable
blur_passes 3
blur_radius 5

corner_radius 10
shadows enable
shadow_blur_radius 20
shadow_color #00000070

default_dim_inactive 0

# swaybar_command (in the shared config) doesn't reliably spawn its child
# under this SwayFX build — launch waybar directly instead. It talks to
# the compositor over wlr-layer-shell regardless of who started it, so
# this works identically to the swaybar_command path.
exec ~/.config/waybar/scripts/launch_waybar.sh
